[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forakilo"
version = "0.1.0"
description = "Deterministic quantitative research and paper-trading core"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.109,<1",
  "uvicorn>=0.23,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
  "behave>=1.2.6,<2",
  "coverage>=7.6,<8",
  "pip-audit>=2.8,<3",
  "pre-commit>=4,<5",
  "pyright>=1.1.400,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forakilo"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"features/**" = ["S101"]
"scripts/verify_lean.py" = ["S603", "S607"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
